<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وب‌سایت من</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #101827, #263b63);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      padding: 40px 25px;
      margin: 20px;
      max-width: 500px;
      background: #ffffff15;
      border: 1px solid #ffffff30;
      border-radius: 22px;
    }
    h1 { color: #69d5ff; }
    p { line-height: 2; }
    a {
      display: inline-block;
      padding: 14px 25px;
      background: #1685e8;
      color: white;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>به وب‌سایت من خوش آمدید ❤️</h1>
    <p>این اولین وب‌سایت من است.</p>
    <p>به زودی با امکانات جدید برمی‌گردیم!</p>
    <a href="https://github.com">ورود به GitHub</a>
  </div>
</body>
</html>
